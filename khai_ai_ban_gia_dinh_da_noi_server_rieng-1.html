<!DOCTYPE html>
<html lang="vi">

<title>KHẢI AI – BẢN GIA ĐÌNH</title>
<style>
:root{--bg:#171419;--panel:#211b22;--panel2:#332832;--pink:#f5c6d9;--muted:#d5a9be;--line:#684b5d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--pink);font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
#chatPage{min-height:100dvh;padding-bottom:82px}.topbar{min-height:58px;padding:9px 15px;display:flex;align-items:center;gap:12px;background:#211b22;border-bottom:1px solid var(--line)}.top-title{font-size:18px;font-weight:700;letter-spacing:1.5px}.top-spacer{flex:1}.top-icon{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--pink);font-size:18px}
.tagline{display:block;width:100%;padding:12px 14px 13px;text-align:center;background:#2d232d;border:0;border-bottom:1px solid var(--line);font-family:Georgia,serif;font-size:13px;letter-spacing:1.2px;line-height:1.45;color:#e4c4d2}.tagline:active{background:#493542}.chat-profile{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}.avatar-button{width:58px;height:58px;flex:0 0 58px;border:2px solid var(--pink);border-radius:50%;padding:0;overflow:hidden;background:#493542;color:var(--pink);font-size:22px;font-weight:bold;background-position:center;background-size:cover}.chat-name{font-size:18px;font-weight:700;letter-spacing:.5px}.chat-tools{display:flex;justify-content:flex-end;padding:9px 15px 0}.clear-btn{border:1px solid var(--line);border-radius:16px;padding:7px 12px;background:transparent;color:var(--muted);font-size:12px}
#chat{padding:18px 14px 24px;height:calc(100dvh - 255px);min-height:220px;overflow-y:auto}.message-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px;max-width:94%}.message-row.user-row{margin-left:auto;flex-direction:row-reverse}.message-avatar{width:34px;height:34px;flex:0 0 34px;border:1.5px solid var(--pink);border-radius:50%;background:#493542;background-position:center;background-size:cover;color:var(--pink);font-size:14px;font-weight:bold;padding:0;overflow:hidden}.message{padding:12px 15px;border-radius:15px;max-width:calc(100% - 42px);line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}.ai{background:var(--panel2);color:var(--pink);border-bottom-left-radius:4px}.user{background:var(--pink);color:#29212a;border-bottom-right-radius:4px}.typing{opacity:.75;font-style:italic}
.input-area{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:var(--panel2);position:fixed;bottom:0;left:0;width:100%;border-top:1px solid var(--line);z-index:5}#messageInput{flex:1;min-width:0;padding:13px;border:1px solid #e8afc4;border-radius:22px;background:var(--bg);color:white;outline:none}.send-btn{border:0;border-radius:22px;padding:0 19px;background:var(--pink);color:#29212a;font-weight:bold}.send-btn:disabled{opacity:.6}
#profilePage{display:none;min-height:100dvh;background:var(--bg);padding-bottom:28px}.profile-topbar{height:54px;padding:0 16px;display:flex;align-items:center;gap:14px;background:var(--panel);border-bottom:1px solid var(--line)}.back-label{font-size:17px;font-weight:700;letter-spacing:1px}.back-arrow{font-size:25px;line-height:1;background:none;border:0;color:var(--pink);padding:0 5px}.cover-wrap{height:190px;position:relative;background:linear-gradient(135deg,#57404f,#211b22 55%,#493542);background-position:center;background-size:cover;cursor:pointer}.cover-wrap:after{content:'Đổi ảnh bìa';position:absolute;right:12px;bottom:10px;padding:6px 9px;border-radius:12px;background:#171419aa;color:#f5c6d9;font-size:11px}.profile-main{padding:0 20px 18px;background:var(--panel);border-bottom:1px solid var(--line)}.profile-head{display:flex;align-items:flex-end;gap:15px;margin-top:-43px;position:relative}.large-avatar{width:104px;height:104px;flex:0 0 104px;border:3px solid var(--pink);border-radius:50%;background:#493542;background-position:center;background-size:cover;cursor:pointer}.identity{padding:0 0 9px;min-width:0}.identity h1{font-size:24px;letter-spacing:1px;margin:0 0 5px}.bio{font-size:13px;color:var(--muted);line-height:1.4}.stats{display:flex;gap:0;margin:18px 0 0 auto;max-width:240px}.stat{flex:1;text-align:center;padding:0 9px}.stat+.stat{border-left:1px solid var(--line)}.infinity{font-size:29px;line-height:1.1;color:var(--pink)}.stat-label{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}.section-title{padding:18px 16px 12px;font-size:13px;letter-spacing:1.6px;color:var(--pink);font-weight:bold}.poster-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:0 10px}.poster{aspect-ratio:1/1;border:0;border-radius:5px;background:linear-gradient(145deg,#493542,#211b22);background-position:center;background-size:cover;position:relative;overflow:hidden;color:#d5a9be;font-size:28px;display:flex;align-items:center;justify-content:center}.poster:after{content:'+';position:absolute;right:7px;bottom:4px;font-size:17px;color:#f5c6d9;text-shadow:0 1px 4px #000}.poster.has-image:after{content:''}.hidden-file{display:none}

<script>
const API_URL="https://khai-ai-gia-dinh-1.onrender.com/chat";
const DB_NAME='khaiFamilyProfileImagesDB',STORE='images';
function openImageDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function saveImage(key,value){const db=await openImageDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function getImage(key){const db=await openImageDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly'),req=tx.objectStore(STORE).get(key);req.onsuccess=()=>resolve(req.result||'');req.onerror=()=>reject(req.error)})}
function compressImage(file,maxSide,quality){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(new Error('Hãy chọn tệp hình ảnh nhé.'));const reader=new FileReader();reader.onerror=()=>reject(reader.error);reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Không đọc được ảnh.'));img.onload=()=>{const scale=Math.min(1,maxSide/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}
async function applyImage(key,file,target,maxSide,quality){try{const data=await compressImage(file,maxSide,quality);await saveImage(key,data);target.style.backgroundImage=`url("${data}")`;target.classList.add('has-image');return data}catch(e){alert(e.message||'Không thể lưu ảnh. Em thử ảnh khác nhé!');return ''}}
function wirePicker(id,key,target,maxSide,quality,onSaved){document.getElementById(id).addEventListener('change',async e=>{const file=e.target.files[0];if(file){const data=await applyImage(key,file,target,maxSide,quality);if(data&&onSaved)onSaved(data)}e.target.value=''})}
function choosePoster(index){const input=document.getElementById('posterInput');input.dataset.index=index;input.click()}
document.getElementById('posterInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const index=Number(e.target.dataset.index);await applyImage('poster'+index,file,document.querySelectorAll('.poster')[index],700,.78);e.target.value=''});
const chatAvatar=document.getElementById('chatAvatar'),profileAvatar=document.getElementById('profileAvatar'),cover=document.getElementById('cover');
wirePicker('coverInput','cover',cover,1500,.8);wirePicker('profileAvatarInput','avatar',profileAvatar,600,.82,data=>{chatAvatar.style.backgroundImage=`url("${data}")`;chatAvatar.textContent=''});
async function restoreImages(){try{const avatar=await getImage('avatar'),userAvatar=await getImage('userAvatar'),banner=await getImage('cover');if(avatar){profileAvatar.style.backgroundImage=`url("${avatar}")`;chatAvatar.style.backgroundImage=`url("${avatar}")`;chatAvatar.textContent=''}if(banner)cover.style.backgroundImage=`url("${banner}")`;if(userAvatar)window.userAvatarData=userAvatar;for(let i=0;i<6;i++){const data=await getImage('poster'+i);if(data){const el=document.querySelectorAll('.poster')[i];el.style.backgroundImage=`url("${data}")`;el.classList.add('has-image');el.textContent=''}}renderAllMessages()}catch(e){console.warn('Không thể tải ảnh hồ sơ',e)}}
const userAvatarInput=document.getElementById('userAvatarInput');userAvatarInput.addEventListener('change',async e=>{const file=e.target.files[0];if(file){const data=await applyImage('userAvatar',file,document.body,500,.82);if(data){window.userAvatarData=data;renderAllMessages()}}e.target.value=''});
function showPage(page){document.getElementById('chatPage').style.display=page==='chat'?'block':'none';document.getElementById('profilePage').style.display=page==='profile'?'block':'none';document.getElementById('kitchenPage').style.display=page==='kitchen'?'block':'none';window.scrollTo(0,0)}
function openProfile(){history.pushState({page:'profile'},'','#profile');showPage('profile')}function closeProfile(){if(location.hash==='#profile')history.back();else showPage('chat')}function openKitchen(){history.pushState({page:'kitchen'},'','#kitchen');showPage('kitchen')}function closeKitchen(){if(location.hash==='#kitchen')history.back();else showPage('chat')}
window.addEventListener('popstate',()=>{if(location.hash==='#profile')showPage('profile');else if(location.hash==='#kitchen')showPage('kitchen');else showPage('chat')});

let reactionTimer=null;
function cookFood(food){const reaction=document.getElementById('khaiReaction'),sticker=document.getElementById('khaiSticker'),text=document.getElementById('khaiReactionText');const happy=food==='cake'||food==='rice';const choices=happy?KHAI_STICKERS.happy:KHAI_STICKERS.sad;const chosen=choices[Math.floor(Math.random()*choices.length)];sticker.src=chosen;text.textContent=happy?'Cũng cũng á.':'nấu ăn vậy sao lấy chồng trời';if(reactionTimer)clearTimeout(reactionTimer);reaction.classList.remove('show');void reaction.offsetWidth;reaction.classList.add('show');reactionTimer=setTimeout(()=>{reaction.classList.remove('show');reactionTimer=null},2500)}
const chat=document.getElementById('chat');let messages=[];try{messages=JSON.parse(localStorage.getItem('khaiFamilyChatHistory'))||[];if(!Array.isArray(messages))messages=[]}catch(e){messages=[]}
function addMessageElement(message){const row=document.createElement('div');row.className='message-row '+(message.sender==='user'?'user-row':'ai-row');const avatar=document.createElement('button');avatar.type='button';avatar.className='message-avatar';avatar.setAttribute('aria-label',message.sender==='user'?'Đổi ảnh đại diện của em':'Mở hồ sơ Khải');if(message.sender==='user'){avatar.textContent='E';if(window.userAvatarData)avatar.style.backgroundImage=`url("${window.userAvatarData}")`;avatar.onclick=()=>userAvatarInput.click()}else{avatar.textContent='';const khaiImage=chatAvatar.style.backgroundImage;if(khaiImage)avatar.style.backgroundImage=khaiImage;avatar.onclick=openProfile}const bubble=document.createElement('div');bubble.className='message '+(message.sender==='user'?'user':'ai');bubble.textContent=message.text||'';row.append(avatar,bubble);chat.appendChild(row)}
function displayMessage(message){addMessageElement(message)}function renderAllMessages(){chat.innerHTML='';if(messages.length===0)displayMessage({sender:'ai',text:'Anh đây. Em muốn kể anh nghe chuyện gì?'});else messages.forEach(displayMessage);chat.scrollTop=chat.scrollHeight}
function saveMessages(){try{localStorage.setItem('khaiFamilyChatHistory',JSON.stringify(messages))}catch(e){alert('Bộ nhớ chat đã đầy. Em thử xóa bớt lịch sử nhé!')}}function loadMessages(){renderAllMessages()}
let sending=false;async function sendMessage(){const input=document.getElementById('messageInput'),button=document.getElementById('sendButton'),value=input.value.trim();if(!value||sending)return;const msg={sender:'user',text:value};messages.push(msg);saveMessages();displayMessage(msg);input.value='';chat.scrollTop=chat.scrollHeight;sending=true;button.disabled=true;const typingRow=document.createElement('div');typingRow.className='message-row ai-row';const typingAvatar=document.createElement('div');typingAvatar.className='message-avatar';if(chatAvatar.style.backgroundImage)typingAvatar.style.backgroundImage=chatAvatar.style.backgroundImage;const typingBubble=document.createElement('div');typingBubble.className='message ai typing';typingBubble.textContent='Khải đang nghĩ...';typingRow.append(typingAvatar,typingBubble);chat.appendChild(typingRow);chat.scrollTop=chat.scrollHeight;try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages.map(m=>({role:m.sender==='user'?'user':'assistant',text:m.text}))})});if(!response.ok)throw new Error('Máy chủ đang bận ('+response.status+').');const data=await response.json();const reply=data.reply||data.response||data.message||data.text||(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');if(!reply)throw new Error('Khải chưa nhận được câu trả lời hợp lệ.');messages.push({sender:'ai',text:reply});saveMessages()}catch(error){messages.push({sender:'ai',text:'Anh đang gặp lỗi kết nối một chút. Em thử gửi lại sau nhé. ('+error.message+')'});saveMessages()}finally{typingRow.remove();renderAllMessages();sending=false;button.disabled=false;input.focus()}}
function clearChat(){if(!confirm('Em có chắc muốn xóa toàn bộ lịch sử trò chuyện không?'))return;messages=[];localStorage.removeItem('khaiFamilyChatHistory');loadMessages()}
showPage(location.hash==='#profile'?'profile':location.hash==='#kitchen'?'kitchen':'chat');loadMessages();restoreImages();
</script>
